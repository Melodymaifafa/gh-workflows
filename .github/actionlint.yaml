# actionlint 的配置。只放「actionlint 内置数据过期了、但事实是对的」这一类例外，
# 每条都写清依据 —— 忽略规则本身也会掩盖真错，不写理由就没人敢删。
paths:
  .github/workflows/claude-codex-iterate.yml:
    ignore:
      # actionlint 1.7.12 的 github context 属性清单里没有 job_workflow_sha，但它
      # 是官方属性：被调用的那份可复用工作流文件所在 commit 的 SHA。取本仓库
      # scripts/ 时正是靠它把脚本和 workflow 钉在同一个版本上。
      - 'property "job_workflow_sha" is not defined'
