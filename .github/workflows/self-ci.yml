name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    # 用本分支自己的 ci.yml（不是 @v1）：PR 里新加的 bats 和 lint 改动当场就跑。
    uses: ./.github/workflows/ci.yml
    with:
      runtime: shell
      # 钉在 24.04：ubuntu-latest 2026-11 换成 26.04 后，claude-verify-creds.bats 的专用账号那条测试挂、
      # 推送被拒那条测试卡到 6 小时超时（PR #81）。这两条在 26.04 上修好之前别改回 ubuntu-latest。
      runs_on: ubuntu-24.04
