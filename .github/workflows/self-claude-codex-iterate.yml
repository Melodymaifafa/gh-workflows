name: Claude iterates on Codex review

on:
  pull_request_review:
    types: [submitted]

# 调用方必须声明权限：可复用工作流只能收窄，不能放宽 caller 给的权限。
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  iterate:
    # TEMPORARY — MEL-272 end-to-end rehearsal. Pinned to a throwaway tag and
    # forced onto the Codex fixer ON PURPOSE, so this PR exercises the new cloud
    # patch path before the v1 tag moves. This whole branch is deleted afterwards.
    # Reviewers: this is the test harness, not a change to review. Leave it alone.
    uses: Melodymaifafa/gh-workflows/.github/workflows/claude-codex-iterate.yml@mel-272-e2e-pin
    with:
      runtime: shell
      review_fixer: codex
    secrets: inherit
