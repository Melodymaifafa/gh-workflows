# 把 main fast-forward 到 develop —— 只挪指针，绝不 merge / squash（那会让两条分支永久分叉）。
# 纯 API 操作：不 checkout、不上传代码，跟谁的本地仓库是不是最新完全无关。
name: Fast-forward main

on:
  workflow_call:
    inputs:
      source:
        description: 拿哪个分支的位置（默认 develop）。
        type: string
        default: develop
      target:
        description: 要挪的分支（默认 main）。
        type: string
        default: main
      min_age_days:
        description: 只挪到「在 source 上待够这么多天」的那个 commit。0 = 直接追到最新。
        type: number
        default: 7
      require_green:
        description: 落点 commit 的 CI 必须全绿才挪。
        type: boolean
        default: true
      dry_run:
        description: 只报告会发生什么，不真的挪。
        type: boolean
        default: false

permissions:
  contents: write
  checks: read

# 同一个仓库不并行挪同一个指针
concurrency:
  group: ff-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  fast-forward:
    runs-on: ubuntu-latest
    steps:
      - name: Move ${{ inputs.target }} to ${{ inputs.source }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          REQUIRE_GREEN: ${{ inputs.require_green }}
          DRY_RUN: ${{ inputs.dry_run }}
          # 定时跑时没人看着日志，断了要推手机；手动跑时她就在页面上，不推。
          UNATTENDED: ${{ github.event_name == 'schedule' }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          set -euo pipefail

          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          # 只在无人值守时推，且每条终态失败路径至多一条。
          alert() {
            [ "$UNATTENDED" = true ] || return 0
            [ -n "${PUSHOVER_TOKEN:-}" ] && [ -n "${PUSHOVER_USER:-}" ] || return 0
            curl -sf -X POST https://api.pushover.net/1/messages.json \
              --form-string "token=$PUSHOVER_TOKEN" --form-string "user=$PUSHOVER_USER" \
              --form-string "title=$1" --form-string "message=$2" >/dev/null 2>&1 || true
          }

          # ── 1. 落点：source 的最新位置，还是「泡够 N 天」的那个更早的位置 ──
          # 泡期存在的理由：追到最新时 target 和 source 完全一样，那就没有可退的点了。
          # 落点仍在 source 这条线上，所以依然是合法快进，只是停得早一点。
          if [ "${MIN_AGE_DAYS:-0}" -gt 0 ]; then
            cutoff="$(date -u -d "$MIN_AGE_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)"
            goal="$(gh api "repos/$REPO/commits?sha=$SOURCE&until=$cutoff&per_page=1" --jq '.[0].sha // empty')"
            if [ -z "$goal" ]; then
              say "### ⏸ \`$SOURCE\` 上没有待够 $MIN_AGE_DAYS 天的 commit，没有动"
              say ""
              say "这条分支上的东西都太新了。下次定时会再看。"
              exit 0
            fi
            say "_落点：\`$SOURCE\` 在 $MIN_AGE_DAYS 天前的位置（\`${goal:0:7}\`），不是最新。_"
          else
            goal="$(gh api "repos/$REPO/git/ref/heads/$SOURCE" --jq .object.sha)"
          fi
          say ""

          # ── 2. 能不能快进 ──
          # compare 的 status 一次回答清楚，比自己算祖先关系省一次 clone。base...head = head 相对 base 的位置。
          cmp="$(gh api "repos/$REPO/compare/$TARGET...$goal")"
          status="$(jq -r .status <<<"$cmp")"
          ahead="$(jq -r .ahead_by <<<"$cmp")"
          behind="$(jq -r .behind_by <<<"$cmp")"

          case "$status" in
            identical)
              say "### ✅ 无需操作"
              say ""
              say "\`$TARGET\` 已经在落点上了。"
              exit 0
              ;;
            ahead) ;;  # 唯一可以继续的情况
            behind)
              say "### ❌ 方向反了，没有动"
              say ""
              say "\`$TARGET\` 比落点还多 $behind 个 commit —— 说明有人直接往 \`$TARGET\` 上提交了。"
              say "先把 \`$TARGET\` 的内容并回 \`$SOURCE\`，再来跑这个。"
              alert "🔀 $REPO：main 反而领先" "有人直接往 main 提交了 $behind 个 commit，快进跳过。先把 main 并回 develop。"
              exit 1
              ;;
            diverged)
              say "### ❌ 两条分支已分叉，没有动"
              say ""
              say "落点领先 $ahead 个、\`$TARGET\` 另有 $behind 个 commit，快进已不可能。"
              say "**不要强推** —— 那会丢掉 \`$TARGET\` 上那 $behind 个 commit。"
              say "[看两边差在哪](https://github.com/$REPO/compare/$TARGET...$SOURCE)"
              alert "🔀 $REPO：develop 和 main 已分叉" "develop 领先 $ahead、main 另有 $behind 个 commit，快进已不可能，需人工处理。"
              exit 1
              ;;
            *)
              say "### ❌ 未知的比对结果 \`$status\`，没有动"
              exit 1
              ;;
          esac

          # ── 3. CI 闸门 ──
          # 定时跑时没人替 target 背书「这版能用」，绿灯是唯一的替代品。
          # skipped / neutral 算过 —— 有些仓库还没配 lint 或测试。
          if [ "$REQUIRE_GREEN" = true ]; then
            runs="$(gh api "repos/$REPO/commits/$goal/check-runs" --jq '.check_runs')"
            total="$(jq length <<<"$runs")"
            pending="$(jq -r '[.[] | select(.status != "completed")] | length' <<<"$runs")"
            bad="$(jq -r '[.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length' <<<"$runs")"
            if [ "$total" -eq 0 ]; then
              say "### ⏸ 落点 \`${goal:0:7}\` 没有任何 CI 记录，没有动"
              say ""
              say "「没跑过 CI」不等于「没问题」，是「不知道」。不知道就不挪。"
              say "要无视这道关：手动跑一次，把 \`require_green\` 取消勾选。"
              alert "⏸ $REPO：快进跳过" "落点 commit 没有 CI 记录，不确定能不能用，没挪 main。"
              exit 0
            fi
            if [ "$pending" -gt 0 ]; then
              say "### ⏸ CI 还在跑（$pending 项未完成），没有动"
              say ""
              say "下次定时会再试。"
              exit 0
            fi
            if [ "$bad" -gt 0 ]; then
              say "### ⏸ CI 没全绿（$bad 项失败），没有动"
              say ""
              say "[看 \`${goal:0:7}\` 的检查结果](https://github.com/$REPO/commit/$goal/checks)"
              alert "⏸ $REPO：快进跳过" "落点 commit 有 $bad 项 CI 失败，没挪 main。修好后下次定时自动重试。"
              exit 0
            fi
            say "_CI 全绿（$total 项），继续。_"
            say ""
          fi

          # ── 4. 挪 ──
          old="$(gh api "repos/$REPO/git/ref/heads/$TARGET" --jq .object.sha)"

          if [ "$DRY_RUN" = true ]; then
            say "### 🔍 试跑，什么都没改"
            say ""
            say "会把 \`$TARGET\` 前移 $ahead 个 commit：\`${old:0:7}\` → \`${goal:0:7}\`。"
            exit 0
          fi

          # force 默认 false：GitHub 服务端自己拒绝非快进，这是最后一道保险。
          gh api -X PATCH "repos/$REPO/git/refs/heads/$TARGET" -f sha="$goal" -F force=false >/dev/null

          say "### ✅ \`$TARGET\` 已前移 $ahead 个 commit"
          say ""
          say "\`${old:0:7}\` → \`${goal:0:7}\`"
          say ""
          say "**要退回去**（快进不销毁任何东西，旧 commit 还是新 commit 的祖先）："
          say '```'
          say "gh api -X PATCH repos/$REPO/git/refs/heads/$TARGET -f sha=$old -F force=true"
          say '```'
          say "往回是非快进，所以要 \`force\`；往前不用。"
          say ""
          say "> 这次推送用的是 Actions 自带令牌，按 GitHub 的防递归规则**不会触发 \`$TARGET\` 上的 CI**。"
          say "> 这些 commit 在 \`$SOURCE\` 上已经跑过一遍了，内容完全相同。"
