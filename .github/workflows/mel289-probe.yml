name: MEL-289 probe

on:
  push:
    branches: ['users/melody/mel-289-probe']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Round 4 - where the cooperative umask lands, and the marker gate
        run: bash .github/mel289-probe-umask.sh
