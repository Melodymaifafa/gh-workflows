name: MEL-289 probe

on:
  push:
    branches: ['users/melody/mel-289-probe']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the shell runtime's tools
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz |
            tar xz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          curl -sSfL https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz | tar xz -C /tmp
          sudo /tmp/bats-core-1.14.0/install.sh /usr/local
      - name: Run the four steps in production order
        run: bash .github/mel289-probe.sh
